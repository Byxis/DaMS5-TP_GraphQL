query MonProfil($id: ID!, $details: Boolean!) {
  user(id: $id) {
    name
    orders {          # TODO 1 (directive) : seulement si $details vaut true
      status
      product {
        name          # TODO 2 (fragment) : remplacer ces deux champs
        price
      }
    }
  }
  products {
    name              # TODO 2 (fragment) : ... et ces deux-là aussi
    price
  }
}

